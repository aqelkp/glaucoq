<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>GlaucoQ — AIOS-FAICO Glaucoma Exam Prep</title>
  <meta name="description" content="High-yield 10-mark glaucoma fellowship exam answers with inline diagrams, topic tags, read tracking, and grounded revision MCQs." />
  <meta name="theme-color" content="#0369a1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="GlaucoQ" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-muted: #f1f5f9;
      --text: #0f172a;
      --text-muted: #475569;
      --border: #e2e8f0;
      --primary: #0369a1;
      --primary-dark: #0c4a6e;
      --primary-light: #e0f2fe;
      --accent: #0f766e;
      --accent-light: #f0fdfa;
      --clinical-bg: #fffbeb;
      --clinical-border: #d97706;
      --success-bg: #dcfce7;
      --success-border: #86efac;
      --success-text: #166534;
      --danger-bg: #fee2e2;
      --danger-border: #fca5a5;
      --danger-text: #991b1b;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 10px 25px -5px rgba(15, 23, 42, 0.14), 0 8px 10px -6px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Google Sans", "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.72;
      font-size: 15.5px;
      -webkit-font-smoothing: antialiased;
    }

    .hidden { display: none !important; }

    /* Top Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: calc(0.65rem + env(safe-area-inset-top)) 1.25rem 0.65rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      min-width: 0;
    }

    .topbar-nav {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      background: var(--surface-muted);
      padding: 0.22rem;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .tab-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 600;
      padding: 0.36rem 0.85rem;
      border-radius: 7px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .tab-btn:hover { color: var(--text); }

    .tab-btn.active {
      background: #ffffff;
      color: var(--primary);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
    }

    .tab-count {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.08rem 0.42rem;
      border-radius: 999px;
      background: var(--primary-light);
      color: var(--primary);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .menu-btn {
      display: none;
      align-items: center;
      gap: 0.35rem;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.4rem 0.65rem;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
    }

    .brand-btn {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      background: transparent;
      border: none;
      cursor: pointer;
      font-family: inherit;
      padding: 0;
      text-align: left;
    }

    .brand-badge {
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 0.28rem 0.62rem;
      border-radius: 6px;
      letter-spacing: 0.02em;
    }

    .brand-title {
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--text);
    }

    .install-btn {
      display: none;
      align-items: center;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 999px;
      padding: 0.34rem 0.75rem;
      font-family: inherit;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
    }

    .install-btn.visible { display: inline-flex; }

    .progress-pill {
      display: inline-flex;
      align-items: center;
      background: var(--accent-light);
      color: var(--accent);
      border: 1px solid #99f6e4;
      font-size: 0.76rem;
      font-weight: 700;
      padding: 0.28rem 0.68rem;
      border-radius: 999px;
      white-space: nowrap;
    }

    /* Buttons */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      background: var(--primary);
      color: #ffffff;
      border: 1px solid var(--primary);
      border-radius: 9px;
      padding: 0.62rem 1.15rem;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-outline {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      background: #ffffff;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 0.58rem 1rem;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-outline:hover:not(:disabled) {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-light);
    }

    .btn-outline:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ==================== HOME PAGE ==================== */
    .page-container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 1.5rem 1.5rem calc(3rem + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
    }

    .hero-card {
      background: linear-gradient(135deg, #0369a1 0%, #0f766e 100%);
      color: #ffffff;
      border-radius: 16px;
      padding: 1.85rem 2rem;
      box-shadow: var(--shadow-lg);
      display: grid;
      grid-template-columns: 1.35fr 0.9fr;
      gap: 1.5rem;
      align-items: center;
    }

    .hero-kicker {
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #bae6fd;
      margin-bottom: 0.35rem;
    }

    .hero-title {
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 0.55rem;
    }

    .hero-desc {
      font-size: 0.94rem;
      color: #e0f2fe;
      margin-bottom: 1.15rem;
      max-width: 560px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
    }

    .btn-hero {
      background: #ffffff;
      color: var(--primary-dark);
      border: none;
      border-radius: 9px;
      padding: 0.68rem 1.2rem;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.16);
      transition: transform 0.12s ease;
    }

    .btn-hero:hover { transform: translateY(-1px); }

    .btn-hero-ghost {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.38);
      border-radius: 9px;
      padding: 0.65rem 1.1rem;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-hero-ghost:hover { background: rgba(255, 255, 255, 0.25); }

    .hero-stats {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 12px;
      padding: 1.15rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.86rem;
    }

    .stat-val {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.25);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #5eead4;
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .home-section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.85rem;
    }

    .home-section-title {
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--text);
    }

    .home-section-sub {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    /* Tag Grid on Home */
    .tag-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
      gap: 0.75rem;
    }

    .tag-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      box-shadow: var(--shadow);
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .tag-card:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(3, 105, 161, 0.1);
    }

    .tag-card.has-answered {
      border-left: 3.5px solid var(--primary);
    }

    .tag-card-name {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text);
    }

    .tag-card-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .tag-card-live {
      color: var(--primary);
      font-weight: 700;
    }

    /* Next Up Cards + Level Cards */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 1rem;
    }

    .panel-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.15rem 1.25rem;
      box-shadow: var(--shadow);
    }

    .quick-q-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .quick-q-item {
      width: 100%;
      text-align: left;
      background: var(--surface-muted);
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 0.65rem 0.8rem;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.14s ease;
    }

    .quick-q-item:hover {
      background: var(--primary-light);
      border-color: var(--primary);
    }

    .quick-q-top {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.15rem;
    }

    .quick-q-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.35;
    }

    .level-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.65rem;
    }

    .level-tile {
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 0.75rem 0.85rem;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.14s ease;
    }

    .level-tile:hover {
      background: var(--primary-light);
      border-color: var(--primary);
    }

    .level-tile-name {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text);
    }

    .level-tile-meta {
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-top: 0.15rem;
    }

    /* ==================== STUDY VIEW ==================== */
    .study-layout {
      max-width: 1240px;
      margin: 0 auto;
      padding: 1.25rem 1.5rem calc(5.5rem + env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: 315px minmax(0, 1fr);
      gap: 1.5rem;
      align-items: start;
    }

    .sidebar-backdrop { display: none; }

    .sidebar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-top {
      padding: 0.85rem 0.85rem 0.65rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      background: #ffffff;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-heading {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    .sidebar-close {
      display: none;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 30px;
      height: 30px;
      font-size: 1.1rem;
      cursor: pointer;
      color: var(--text);
      align-items: center;
      justify-content: center;
    }

    .search-input,
    .tag-select {
      width: 100%;
      padding: 0.46rem 0.68rem;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-family: inherit;
      font-size: 0.84rem;
      color: var(--text);
      background: var(--bg);
      outline: none;
    }

    .search-input:focus,
    .tag-select:focus {
      border-color: var(--primary);
      background: #ffffff;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.28rem;
    }

    .filter-pill {
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
    }

    .filter-pill.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .scope-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .toggle-label {
      display: inline-flex;
      align-items: center;
      gap: 0.32rem;
      cursor: pointer;
      font-weight: 600;
      color: var(--text);
    }

    .sidebar-scroll {
      overflow-y: auto;
      padding: 0.6rem 0.7rem 1rem;
      flex: 1;
    }

    .nav-group { margin-bottom: 0.8rem; }

    .nav-group-title {
      font-size: 0.69rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      padding: 0.22rem 0.35rem;
      margin-bottom: 0.28rem;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .nav-item {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 0.5rem 0.58rem;
      cursor: pointer;
      transition: all 0.14s ease;
      font-family: inherit;
      color: var(--text);
    }

    .nav-item:hover { background: var(--surface-muted); }

    .nav-item.active {
      background: var(--primary-light);
      border-color: var(--primary);
    }

    .nav-item.pending { opacity: 0.65; }

    .nav-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-top: 0.42rem;
      flex-shrink: 0;
      background: #cbd5e1;
    }

    .nav-item.answered .nav-dot { background: var(--primary); }
    .nav-item.read .nav-dot { background: #16a34a; }

    .nav-item-body { min-width: 0; flex: 1; }

    .nav-item-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.1rem;
    }

    .nav-item.read .nav-item-meta .meta-state { color: #15803d; }
    .nav-item.pending .nav-item-meta { color: var(--text-muted); }

    .nav-item-title {
      font-size: 0.81rem;
      font-weight: 500;
      line-height: 1.34;
    }

    .nav-item.active .nav-item-title { font-weight: 700; }

    /* Active Filter Banner */
    .active-filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      background: var(--primary-light);
      border: 1px solid #bae6fd;
      color: var(--primary-dark);
      border-radius: 9px;
      padding: 0.55rem 0.9rem;
      margin-bottom: 0.9rem;
      font-size: 0.84rem;
      font-weight: 600;
    }

    .clear-filter-btn {
      background: #ffffff;
      border: 1px solid #7dd3fc;
      color: var(--primary);
      border-radius: 6px;
      padding: 0.2rem 0.55rem;
      font-family: inherit;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Question Card */
    .main { min-width: 0; }

    .question-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .q-header {
      padding: 1.35rem 1.75rem;
      background: linear-gradient(to right, #f0f9ff, #ffffff);
      border-bottom: 1px solid var(--border);
    }

    .q-header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 0.55rem;
    }

    .q-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .tag {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.2rem 0.58rem;
      border-radius: 5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .tag-level { background: var(--primary-light); color: var(--primary); }
    .tag-cat { background: var(--surface-muted); color: var(--text-muted); }
    .tag-marks { background: var(--success-bg); color: var(--success-text); }

    .topic-tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.65rem;
    }

    .topic-tag-chip {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.74rem;
      font-weight: 600;
      padding: 0.18rem 0.6rem;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.14s ease;
    }

    .topic-tag-chip:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-light);
    }

    .read-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.36rem 0.8rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .read-btn:hover { border-color: #16a34a; color: #166534; }

    .read-btn.is-read {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success-text);
    }

    .q-title {
      font-size: 1.28rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.38;
    }

    .q-body {
      padding: 1.65rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.55rem;
    }

    .exam-section h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
      border-bottom: 2px solid var(--primary-light);
      padding-bottom: 0.35rem;
      margin-bottom: 0.8rem;
    }

    .exam-section h3 {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text);
      margin-top: 1.05rem;
      margin-bottom: 0.42rem;
    }

    .exam-section p { margin-bottom: 0.75rem; color: #1e293b; }
    .exam-section ul, .exam-section ol { padding-left: 1.35rem; margin-bottom: 0.8rem; }
    .exam-section li { margin-bottom: 0.48rem; color: #1e293b; }

    .formula-box {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin: 0.75rem 0;
      text-align: center;
      font-size: 1.02rem;
      font-weight: 700;
      color: #0c4a6e;
    }

    .clinical-note {
      background: var(--clinical-bg);
      border-left: 3.5px solid var(--clinical-border);
      padding: 0.75rem 1rem;
      border-radius: 0 6px 6px 0;
      margin: 0.75rem 0;
      font-size: 0.93rem;
    }

    .clinical-note-title { font-weight: 700; color: #92400e; margin-bottom: 0.25rem; }
    .clinical-note ul { margin-bottom: 0; }

    /* Inline Figures */
    .inline-figure {
      position: relative;
      margin: 1rem auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #ffffff;
      padding: 0.65rem 0.85rem 0.85rem;
      max-width: 580px;
      cursor: zoom-in;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .inline-figure:hover {
      border-color: #7dd3fc;
      box-shadow: 0 4px 12px rgba(3, 105, 161, 0.08);
    }

    .figure-zoom-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 0.35rem;
    }

    .figure-zoom-hint {
      background: var(--primary-light);
      border: 1px solid #bae6fd;
      color: var(--primary);
      font-size: 0.69rem;
      font-weight: 700;
      padding: 0.14rem 0.5rem;
      border-radius: 999px;
      pointer-events: none;
    }

    .inline-figure svg { width: 100%; height: auto; display: block; background: #fcfdff; border-radius: 6px; }
    .figure-caption { margin-top: 0.55rem; font-size: 0.82rem; color: var(--text-muted); line-height: 1.45; text-align: center; }

    /* Tables */
    .table-wrap { overflow-x: auto; margin: 0.85rem 0; border: 1px solid var(--border); border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; text-align: left; }
    th { background: var(--surface-muted); font-weight: 700; color: var(--text); padding: 0.65rem 0.8rem; border-bottom: 1px solid var(--border); }
    td { padding: 0.6rem 0.8rem; border-bottom: 1px solid var(--border); vertical-align: top; line-height: 1.55; }
    tr:last-child td { border-bottom: none; }

    /* Citation Badges */
    .cite-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      vertical-align: super;
      font-size: 0.7rem;
      font-weight: 700;
      line-height: 1;
      min-width: 1.35rem;
      height: 1.2rem;
      padding: 0 0.28rem;
      margin: 0 0.08rem;
      border-radius: 4px;
      border: 1px solid #bae6fd;
      background: var(--primary-light);
      color: var(--primary);
      cursor: pointer;
      font-family: inherit;
    }

    @media (pointer: coarse) {
      .cite-btn { min-width: 1.6rem; height: 1.4rem; font-size: 0.74rem; vertical-align: baseline; }
    }

    .cite-btn:hover, .cite-btn.active { background: var(--primary); color: #ffffff; border-color: var(--primary); }

    /* Question Footer Action Bar */
    .q-footer-cta {
      padding: 1.15rem 1.75rem;
      border-top: 1px solid var(--border);
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .q-footer-hint {
      font-size: 0.84rem;
      color: var(--text-muted);
    }

    /* References footer */
    .refs-section {
      background: var(--surface-muted);
      border-top: 1px solid var(--border);
      padding: 1.1rem 1.75rem;
    }

    .refs-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 0.55rem; }
    .refs-list { list-style: none; display: flex; flex-direction: column; gap: 0.32rem; font-size: 0.84rem; }
    .ref-row { display: flex; align-items: baseline; gap: 0.5rem; padding: 0.3rem 0.5rem; border-radius: 6px; cursor: pointer; }
    .ref-row:hover { background: #e2e8f0; }
    .ref-num { font-weight: 700; color: var(--primary); min-width: 1.6rem; }

    /* Pending state */
    .pending-box { padding: 2.25rem 1.5rem; text-align: center; color: var(--text-muted); }
    .pending-box h3 { color: var(--text); margin-bottom: 0.45rem; font-size: 1.05rem; }
    .pending-subitems { text-align: left; max-width: 540px; margin: 1rem auto 0; background: var(--surface-muted); padding: 0.9rem 1.25rem; border-radius: 8px; font-size: 0.88rem; }

    /* Sticky Bottom Question Pager (Study view only) */
    .bottom-pager {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 25;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border);
      padding: 0.55rem 1rem calc(0.55rem + env(safe-area-inset-bottom));
    }

    .bottom-pager-inner {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .pager-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.46rem 0.88rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
    }

    .pager-btn:hover:not(:disabled) { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
    .pager-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .pager-status { font-size: 0.82rem; font-weight: 600; color: var(--text-muted); text-align: center; }

    /* ==================== REVISION MCQ VIEW ==================== */
    .rev-container {
      max-width: 820px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem calc(3rem + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .rev-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.6rem 1.75rem;
      box-shadow: var(--shadow);
    }

    .rev-empty {
      text-align: center;
      padding: 2.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
    }

    .rev-empty-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 700;
    }

    .rev-setup-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 0.75rem;
      margin: 1rem 0 1.25rem;
    }

    .rev-stat-tile {
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem 1rem;
    }

    .rev-stat-label { font-size: 0.74rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); }
    .rev-stat-num { font-size: 1.35rem; font-weight: 700; color: var(--primary); margin-top: 0.15rem; }

    .rev-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .mcq-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.9rem;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .mcq-bar {
      width: 100%;
      height: 6px;
      background: var(--surface-muted);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 1.15rem;
    }

    .mcq-bar-fill {
      height: 100%;
      background: var(--primary);
      transition: width 0.2s ease;
    }

    .mcq-stem {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.48;
      margin-bottom: 1.1rem;
    }

    .mcq-options {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .mcq-option {
      width: 100%;
      text-align: left;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 0.78rem 0.95rem;
      display: flex;
      align-items: flex-start;
      gap: 0.7rem;
      font-family: inherit;
      font-size: 0.93rem;
      color: var(--text);
      cursor: pointer;
      transition: all 0.14s ease;
    }

    .mcq-option:hover:not(:disabled) {
      border-color: var(--primary);
      background: #f0f9ff;
    }

    .mcq-option:disabled { cursor: default; }

    .mcq-option.correct {
      background: var(--success-bg);
      border-color: #16a34a;
      color: var(--success-text);
      font-weight: 600;
    }

    .mcq-option.wrong {
      background: var(--danger-bg);
      border-color: #dc2626;
      color: var(--danger-text);
    }

    .mcq-letter {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: var(--surface-muted);
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .mcq-option.correct .mcq-letter { background: #16a34a; color: #ffffff; }
    .mcq-option.wrong .mcq-letter { background: #dc2626; color: #ffffff; }

    .mcq-feedback {
      margin-top: 1.15rem;
      padding: 1rem 1.1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .mcq-feedback-head {
      font-size: 0.92rem;
      font-weight: 700;
    }

    .mcq-feedback.is-correct { background: #f0fdf4; border-color: #bbf7d0; }
    .mcq-feedback.is-correct .mcq-feedback-head { color: #166534; }
    .mcq-feedback.is-wrong { background: #fef2f2; border-color: #fecaca; }
    .mcq-feedback.is-wrong .mcq-feedback-head { color: #991b1b; }

    .mcq-feedback-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.25rem;
    }

    /* Source Drawer & Lightbox */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.38);
      z-index: 50;
      display: none;
      justify-content: flex-end;
    }

    .drawer-backdrop.open { display: flex; }

    .drawer {
      width: 100%;
      max-width: 450px;
      background: var(--surface);
      height: 100%;
      box-shadow: var(--shadow-lg);
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      overflow-y: auto;
      animation: slideIn 0.18s ease-out;
    }

    @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .drawer-handle { display: none; width: 40px; height: 4px; border-radius: 999px; background: #cbd5e1; margin: -0.35rem auto 0.25rem; }
    .drawer-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 0.7rem; }
    .drawer-badge { background: var(--primary); color: #fff; font-weight: 700; font-size: 0.82rem; padding: 0.22rem 0.6rem; border-radius: 5px; }
    .drawer-close { background: var(--surface-muted); border: 1px solid var(--border); border-radius: 6px; width: 32px; height: 32px; font-size: 1.15rem; cursor: pointer; color: var(--text); display: flex; align-items: center; justify-content: center; }
    .drawer-field-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.2rem; }
    .drawer-book { font-size: 1.04rem; font-weight: 700; color: var(--text); line-height: 1.35; }
    .drawer-chapter { font-size: 0.9rem; color: var(--primary); font-weight: 600; }
    .drawer-quote { background: var(--surface-muted); border-left: 3.5px solid var(--primary); padding: 0.9rem 1rem; border-radius: 0 6px 6px 0; font-size: 0.92rem; color: var(--text); line-height: 1.65; }
    .drawer-nav { margin-top: auto; padding-top: 0.9rem; border-top: 1px solid var(--border); display: flex; gap: 0.75rem; }
    .btn-secondary { flex: 1; padding: 0.55rem 0.75rem; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-weight: 600; font-size: 0.86rem; font-family: inherit; cursor: pointer; }
    .btn-secondary:disabled { opacity: 0.45; cursor: not-allowed; }

    .lightbox-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.74); z-index: 60; display: none; align-items: center; justify-content: center; padding: 1rem; }
    .lightbox-backdrop.open { display: flex; }
    .lightbox-card { background: #ffffff; border-radius: 12px; width: 100%; max-width: 920px; max-height: 92vh; overflow: auto; padding: 1rem; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; gap: 0.75rem; }
    .lightbox-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 0.6rem; }
    .lightbox-title { font-size: 0.9rem; font-weight: 700; color: var(--primary); }
    .lightbox-stage { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .lightbox-stage svg { width: 100%; min-width: 520px; height: auto; display: block; background: #fcfdff; border-radius: 6px; }
    .lightbox-caption { font-size: 0.86rem; color: var(--text-muted); text-align: center; }

    /* Responsive Breakpoints */
    @media (max-width: 1023px) {
      .study-mode .menu-btn { display: inline-flex; }
      .study-layout { grid-template-columns: minmax(0, 1fr); max-width: 840px; padding: 1rem 1rem calc(5.5rem + env(safe-area-inset-bottom)); }
      .sidebar-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); z-index: 40; }
      .sidebar-backdrop.open { display: block; }
      .sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: min(335px, 88vw); max-height: 100vh; z-index: 45; border-radius: 0; border: none; border-right: 1px solid var(--border); padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); transform: translateX(-100%); transition: transform 0.2s ease; }
      .sidebar.open { transform: translateX(0); }
      .sidebar-close { display: flex; }
    }

    @media (max-width: 820px) {
      .hero-card { grid-template-columns: 1fr; padding: 1.4rem 1.25rem; }
      .brand-title { display: none; }
    }

    @media (max-width: 767px) {
      .drawer-backdrop { align-items: flex-end; justify-content: center; }
      .drawer { max-width: 100%; height: auto; max-height: 82vh; border-radius: 16px 16px 0 0; padding: 1.15rem 1.2rem calc(1.25rem + env(safe-area-inset-bottom)); animation: slideUp 0.2s ease-out; }
      .drawer-handle { display: block; }
    }

    @media (max-width: 640px) {
      body { font-size: 15px; }
      .topbar { padding: calc(0.55rem + env(safe-area-inset-top)) 0.7rem 0.55rem; gap: 0.4rem; }
      .tab-btn { padding: 0.34rem 0.58rem; font-size: 0.79rem; }
      .progress-pill { display: none; }
      .page-container { padding: 1rem 0.85rem calc(2.5rem + env(safe-area-inset-bottom)); }
      .hero-title { font-size: 1.32rem; }
      .study-layout { padding: 0.75rem 0.65rem calc(5.2rem + env(safe-area-inset-bottom)); }
      .q-header { padding: 1.05rem 1rem; }
      .q-body { padding: 1.15rem 1rem; }
      .q-title { font-size: 1.12rem; }
      .q-footer-cta, .refs-section { padding: 1rem; }
      .rev-container { padding: 1rem 0.75rem calc(2.5rem + env(safe-area-inset-bottom)); }
      .rev-card { padding: 1.15rem 1rem; }
      .level-grid { grid-template-columns: 1fr; }
      .table-wrap table, .table-wrap tbody, .table-wrap tr, .table-wrap td { display: block; width: 100%; }
      .table-wrap thead { display: none; }
      .table-wrap tr { border-bottom: 1px solid var(--border); padding: 0.65rem 0.8rem; }
      .table-wrap tr:last-child { border-bottom: none; }
      .table-wrap td { border: none; padding: 0.15rem 0; }
      .table-wrap td:first-child { color: var(--primary); font-size: 0.94rem; margin-bottom: 0.2rem; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Open questions menu" aria-expanded="false">
        <span>&#9776;</span>
      </button>
      <button class="brand-btn" id="brandBtn" type="button" aria-label="Go to Home">
        <span class="brand-badge">GlaucoQ</span>
        <span class="brand-title">AIOS-FAICO Prep</span>
      </button>
    </div>

    <nav class="topbar-nav" aria-label="Primary navigation">
      <button class="tab-btn active" data-view="home" id="tabHome" type="button">Home</button>
      <button class="tab-btn" data-view="study" id="tabStudy" type="button">Study</button>
      <button class="tab-btn" data-view="revision" id="tabRevision" type="button">
        <span>Revision</span>
        <span class="tab-count" id="revBadge">0</span>
      </button>
    </nav>

    <div class="topbar-right">
      <button class="install-btn" id="installBtn" type="button">Install</button>
      <div class="progress-pill" id="progressPill">0 / 10 Read</div>
    </div>
  </header>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <!-- VIEW 1: HOME DASHBOARD -->
  <section id="viewHome" class="page-container"></section>

  <!-- VIEW 2: STUDY VIEW -->
  <section id="viewStudy" class="study-layout hidden">
    <aside class="sidebar" id="sidebar" aria-label="Question navigation">
      <div class="sidebar-top">
        <div class="sidebar-header">
          <div class="sidebar-heading">Syllabus Navigator</div>
          <button class="sidebar-close" id="sidebarClose" type="button" aria-label="Close questions menu">&times;</button>
        </div>
        <input class="search-input" id="searchInput" type="search" placeholder="Search questions, topics, trials…" aria-label="Search questions" />
        <select class="tag-select" id="tagSelect" aria-label="Filter by topic tag"></select>
        <div class="filter-row" id="levelFilters" role="tablist" aria-label="Filter by curriculum level"></div>
        <div class="scope-row">
          <label class="toggle-label">
            <input type="checkbox" id="answeredOnlyToggle" checked />
            <span>Answered</span>
          </label>
          <label class="toggle-label">
            <input type="checkbox" id="unreadOnlyToggle" />
            <span>Unread only</span>
          </label>
        </div>
      </div>
      <div class="sidebar-scroll" id="sidebarList"></div>
    </aside>

    <main class="main" id="mainContainer">
      <div id="activeFilterBar" class="active-filter-bar hidden">
        <span id="activeFilterLabel"></span>
        <button class="clear-filter-btn" id="clearFilterBtn" type="button">Clear filter &times;</button>
      </div>
      <article class="question-card" id="questionCard"></article>
    </main>
  </section>

  <!-- Sticky Bottom Pager (Study view only) -->
  <nav class="bottom-pager hidden" id="bottomPager" aria-label="Question pagination">
    <div class="bottom-pager-inner">
      <button class="pager-btn" id="prevQBtn" type="button">&larr; Previous</button>
      <div class="pager-status" id="pagerStatus">Question 1</div>
      <button class="pager-btn" id="nextQBtn" type="button">Next &rarr;</button>
    </div>
  </nav>

  <!-- VIEW 3: REVISION MCQ PAGE -->
  <section id="viewRevision" class="rev-container hidden"></section>

  <!-- Source Inspector Drawer / Mobile Bottom Sheet -->
  <div class="drawer-backdrop" id="drawerBackdrop" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <div class="drawer">
      <div class="drawer-handle" aria-hidden="true"></div>
      <div class="drawer-header">
        <span class="drawer-badge" id="drawerBadge">Source [1]</span>
        <button class="drawer-close" id="drawerClose" type="button" aria-label="Close source panel">&times;</button>
      </div>
      <div>
        <div class="drawer-field-label">Reference Textbook</div>
        <div class="drawer-book" id="drawerTitle"></div>
      </div>
      <div>
        <div class="drawer-field-label">Chapter / Section</div>
        <div class="drawer-chapter" id="drawerChapter"></div>
      </div>
      <div>
        <div class="drawer-field-label">Grounded Excerpt</div>
        <div class="drawer-quote" id="drawerQuote"></div>
      </div>
      <div class="drawer-nav">
        <button class="btn-secondary" id="prevCiteBtn" type="button">&larr; Previous</button>
        <button class="btn-secondary" id="nextCiteBtn" type="button">Next &rarr;</button>
      </div>
    </div>
  </div>

  <!-- Figure Zoom Lightbox -->
  <div class="lightbox-backdrop" id="lightboxBackdrop" role="dialog" aria-modal="true" aria-label="Enlarged diagram view">
    <div class="lightbox-card">
      <div class="lightbox-header">
        <span class="lightbox-title">Diagram View</span>
        <button class="drawer-close" id="lightboxClose" type="button" aria-label="Close diagram">&times;</button>
      </div>
      <div class="lightbox-stage" id="lightboxStage"></div>
      <div class="lightbox-caption" id="lightboxCaption"></div>
    </div>
  </div>

  <script>
    (function () {
      const READ_KEY = "glaucoq_read_v1";
      const LEGACY_STUDIED_KEY = "glaucoq_studied_v1";
      const MISSED_MCQ_KEY = "glaucoq_missed_mcq_v1";

      let allQuestions = [];
      let allTags = [];
      let answersMap = {};
      let readSet = new Set();
      let missedMcqSet = new Set();

      // View & Filter State
      let currentView = "home"; // "home" | "study" | "revision"
      let activeLevel = "All";
      let activeTag = "All";
      let searchQuery = "";
      let answeredOnly = true;

      // Safe rich-text renderer (zero innerHTML)
      function appendRichText(parent, text) {
        if (!text) return;
        const tokenRegex = /(\*\*[^*]+\*\*|\*[^*]+\*|\[\d+\])/g;
        let lastIndex = 0;
        let match;
        while ((match = tokenRegex.exec(text)) !== null) {
          if (match.index > lastIndex) {
            parent.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
          }
          const token = match[0];
          if (token.startsWith("**") && token.endsWith("**")) {
            const strong = document.createElement("strong");
            appendRichText(strong, token.slice(2, -2));
            parent.appendChild(strong);
          } else if (token.startsWith("*") && token.endsWith("*")) {
            const em = document.createElement("em");
            appendRichText(em, token.slice(1, -1));
            parent.appendChild(em);
          } else if (token.startsWith("[") && token.endsWith("]")) {
            const citeNum = token.slice(1, -1);
            const btn = document.createElement("button");
            btn.className = "cite-btn";
            btn.type = "button";
            btn.setAttribute("data-cite", citeNum);
            btn.textContent = citeNum;
            parent.appendChild(btn);
          }
          lastIndex = tokenRegex.lastIndex;
        }
        if (lastIndex < text.length) {
          parent.appendChild(document.createTextNode(text.slice(lastIndex)));
        }
      }

      // Safe SVG parser using DOMParser
      function parseSafeSvg(svgString) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(svgString, "image/svg+xml");
        const svgEl = doc.documentElement;
        if (!svgEl || svgEl.nodeName.toLowerCase() !== "svg") return null;
        svgEl.querySelectorAll("script, foreignObject").forEach(function (bad) { bad.remove(); });
        svgEl.querySelectorAll("*").forEach(function (node) {
          Array.from(node.attributes).forEach(function (attr) {
            if (attr.name.toLowerCase().startsWith("on")) node.removeAttribute(attr.name);
          });
        });
        return document.importNode(svgEl, true);
      }

      // Helpers
      function getAnsweredQuestions() {
        return allQuestions.filter(function (q) { return Boolean(answersMap[q.id]); });

      function getNextUnreadQuestion(list) {
        const pool = list || getAnsweredQuestions();
        const unread = pool.find(function (q) { return Boolean(answersMap[q.id]) && !readSet.has(q.id); });
        return unread || pool.find(function (q) { return Boolean(answersMap[q.id]); }) || pool[0] || null;
      }

      function getUnlockedMcqs(tagFilter) {
        const pool = [];
        allQuestions.forEach(function (q) {
          if (!readSet.has(q.id)) return;
          const ans = answersMap[q.id];
          if (!ans || !Array.isArray(ans.mcqs)) return;
          if (tagFilter && tagFilter !== "All" && (q.tags || []).indexOf(tagFilter) === -1) return;
          ans.mcqs.forEach(function (m) {
            pool.push({
              mcq: m,
              question: q,
              answerObj: ans
            });
          });
        });
        return pool;
      }

      function buildSearchHaystack(item) {
        const ans = answersMap[item.id];
        const parts = [item.question, item.level, item.category, (item.tags || []).join(" ")];
        if (ans) {
          if (ans.shortTitle) parts.push(ans.shortTitle);
          (ans.sections || []).forEach(function (sec) {
            parts.push(sec.heading || "");
            (sec.blocks || []).forEach(function (blk) {
              if (blk.text) parts.push(blk.text);
              if (blk.title) parts.push(blk.title);
              if (blk.items) parts.push(blk.items.join(" "));
              if (blk.rows) blk.rows.forEach(function (r) { parts.push(r.join(" ")); });
            });
          });
        }
        return parts.join(" ").toLowerCase();
      }

      function getFilteredQuestions() {
        const qLower = searchQuery.trim().toLowerCase();
        return allQuestions.filter(function (item) {
          if (answeredOnly && !answersMap[item.id]) return false;
          if (unreadOnly && readSet.has(item.id)) return false;
          if (activeLevel !== "All" && item.level !== activeLevel) return false;
          if (activeTag !== "All" && (item.tags || []).indexOf(activeTag) === -1) return false;
          if (!qLower) return true;
          if (!searchCache[item.id]) searchCache[item.id] = buildSearchHaystack(item);
          return searchCache[item.id].indexOf(qLower) !== -1;
        });
      }

        if (viewName === "home") {
          history.replaceState(null, "", "#home");
          renderHome();
          window.scrollTo({ top: 0, behavior: "instant" });
        } else if (viewName === "study") {
          const opts = options || {};

          renderLevelFilters();
