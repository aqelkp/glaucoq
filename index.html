          activeFilterLabel.textContent = "Active Filter — " + parts.join(" · ");
          activeFilterBar.classList.remove("hidden");
        }
      }

      function renderSidebar() {
        renderTagDropdown();
        updateActiveFilterBar();
        const filtered = getFilteredQuestions();
        sidebarList.replaceChildren();

        if (filtered.length === 0) {
          const empty = document.createElement("div");
          empty.className = "pending-box";
          empty.textContent = "No matching questions. Try unchecking 'Answered' or clearing filters.";
          sidebarList.appendChild(empty);
          return;
        }

        const groups = [];
        const groupMap = {};
        filtered.forEach(function (item) {
          const gKey = item.level + " · " + item.category;
          if (!groupMap[gKey]) {
            groupMap[gKey] = { title: gKey, items: [] };
            groups.push(groupMap[gKey]);
          }
          groupMap[gKey].items.push(item);
        });

        groups.forEach(function (group) {
          const groupDiv = document.createElement("div");
          groupDiv.className = "nav-group";

          const titleDiv = document.createElement("div");
          titleDiv.className = "nav-group-title";
          titleDiv.textContent = group.title;
          groupDiv.appendChild(titleDiv);

          const listDiv = document.createElement("div");
          listDiv.className = "nav-list";

          group.items.forEach(function (item) {
            const isAnswered = Boolean(answersMap[item.id]);
            const isRead = readSet.has(item.id);
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className =
              "nav-item" +
              (isAnswered ? " answered" : " pending") +
              (isRead ? " read" : "") +
              (item.id === activeQuestionId ? " active" : "");

            const dot = document.createElement("span");
            dot.className = "nav-dot";
            btn.appendChild(dot);

            const body = document.createElement("div");
            body.className = "nav-item-body";

            const meta = document.createElement("div");
            meta.className = "nav-item-meta";
            const leftSpan = document.createElement("span");
            leftSpan.textContent = "Q" + item.globalIndex;
            const rightSpan = document.createElement("span");
            rightSpan.className = "meta-state";
            rightSpan.textContent = isRead ? "✓ Read" : isAnswered ? "Unread" : "Upcoming";
            meta.appendChild(leftSpan);
            meta.appendChild(rightSpan);
            body.appendChild(meta);

            const label = document.createElement("div");
            label.className = "nav-item-title";
            label.textContent = isAnswered && answersMap[item.id].shortTitle ? answersMap[item.id].shortTitle : item.question;
            body.appendChild(label);

            btn.appendChild(body);
            btn.addEventListener("click", function () {
              selectQuestion(item.id, true);
              closeSidebar();
            });
            listDiv.appendChild(btn);
          });

          groupDiv.appendChild(listDiv);
          sidebarList.appendChild(groupDiv);
        });
      }

      function updatePager() {
        const list = getFilteredQuestions();
        const idx = list.findIndex(function (q) { return q.id === activeQuestionId; });
        if (idx === -1) {
          prevQBtn.disabled = true;
          nextQBtn.disabled = list.length === 0;
          pagerStatus.textContent = list.length + " in filter";
          return;
        }
        prevQBtn.disabled = idx <= 0;
        nextQBtn.disabled = idx >= list.length - 1;
        pagerStatus.textContent = "Q" + list[idx].globalIndex + "  (" + (idx + 1) + " of " + list.length + ")";
      }

      function renderQuestion(item) {
        const ans = answersMap[item.id];
        currentSources = ans && ans.sources ? ans.sources : {};
        questionCard.replaceChildren();

        // Header
        const header = document.createElement("div");
        header.className = "q-header";

        const headerTop = document.createElement("div");
        headerTop.className = "q-header-top";

        const tags = document.createElement("div");
        tags.className = "q-tags";

        const tLevel = document.createElement("span"); tLevel.className = "tag tag-level"; tLevel.textContent = item.level; tags.appendChild(tLevel);
        const tCat = document.createElement("span"); tCat.className = "tag tag-cat"; tCat.textContent = item.category + " · Q" + item.globalIndex + "/87"; tags.appendChild(tCat);
        if (ans) {
          const tMarks = document.createElement("span"); tMarks.className = "tag tag-marks"; tMarks.textContent = (ans.marks || 10) + " Marks"; tags.appendChild(tMarks);
        }
        headerTop.appendChild(tags);

        if (ans) {
          const readBtn = document.createElement("button");
          readBtn.type = "button";
          const isRead = readSet.has(item.id);
          readBtn.className = "read-btn" + (isRead ? " is-read" : "");
          readBtn.textContent = isRead ? "✓ Marked as Read" : "Mark as Read";
          readBtn.addEventListener("click", function () {
            if (readSet.has(item.id)) readSet.delete(item.id);
            else readSet.add(item.id);
            saveRead();
            updateGlobalCounters();
            renderQuestion(item);
            renderSidebar();
            updatePager();
          });
          headerTop.appendChild(readBtn);
        }

        header.appendChild(headerTop);

        const h1 = document.createElement("h1");
        h1.className = "q-title";
        h1.textContent = item.question;
        header.appendChild(h1);

        // Clickable topic tags on question
        if (item.tags && item.tags.length) {
          const tRow = document.createElement("div");
          tRow.className = "topic-tags-row";
          item.tags.forEach(function (tName) {
            const chip = document.createElement("button");
            chip.type = "button";
            chip.className = "topic-tag-chip";
            chip.textContent = "# " + tName;
            chip.addEventListener("click", function () {
              activeTag = tName;
              activeLevel = "All";
              const hasAns = allQuestions.some(function (q) { return (q.tags || []).indexOf(tName) !== -1 && Boolean(answersMap[q.id]); });
              answeredOnly = hasAns;
              answeredOnlyToggle.checked = answeredOnly;
              renderLevelFilters();
              const filtered = getFilteredQuestions();
              const target = getNextUnreadQuestion(filtered);
              if (target) selectQuestion(target.id, true);
              else { renderSidebar(); updatePager(); }
            });
            tRow.appendChild(chip);
          });
          header.appendChild(tRow);
        }

        questionCard.appendChild(header);

        // Pending question fallback
        if (!ans) {
          const pending = document.createElement("div");
          pending.className = "pending-box";
          const ph = document.createElement("h3"); ph.textContent = "Answer Coming in an Upcoming Batch"; pending.appendChild(ph);
          const pp = document.createElement("p"); pp.textContent = "Questions are authored and deployed in batches of 10 with inline diagrams, grounded references, and revision MCQs."; pending.appendChild(pp);
          if (item.sub_items && item.sub_items.length) {
            const subBox = document.createElement("div");
            subBox.className = "pending-subitems";
            const ul = document.createElement("ul");
            item.sub_items.forEach(function (sub) {
              const li = document.createElement("li");
              li.textContent = sub.label + ". " + sub.text;
              ul.appendChild(li);
            });
            subBox.appendChild(ul);
            pending.appendChild(subBox);
          }
          questionCard.appendChild(pending);
          return;
        }

        // Body
        const body = document.createElement("div");
        body.className = "q-body";

        (ans.sections || []).forEach(function (sec) {
          const secEl = document.createElement("section");
          secEl.className = "exam-section";
          const h2 = document.createElement("h2"); h2.textContent = sec.heading; secEl.appendChild(h2);

          (sec.blocks || []).forEach(function (blk) {
            if (blk.type === "p") {
              const p = document.createElement("p"); appendRichText(p, blk.text); secEl.appendChild(p);
            } else if (blk.type === "subheading") {
              const h3 = document.createElement("h3"); h3.textContent = blk.text; secEl.appendChild(h3);
            } else if (blk.type === "formula") {
              const div = document.createElement("div"); div.className = "formula-box"; appendRichText(div, blk.text); secEl.appendChild(div);
            } else if (blk.type === "ul" || blk.type === "ol") {
              const list = document.createElement(blk.type);
              (blk.items || []).forEach(function (it) { const li = document.createElement("li"); appendRichText(li, it); list.appendChild(li); });
              secEl.appendChild(list);
            } else if (blk.type === "clinical") {
              const box = document.createElement("div"); box.className = "clinical-note";
              if (blk.title) { const ct = document.createElement("div"); ct.className = "clinical-note-title"; ct.textContent = blk.title; box.appendChild(ct); }
              if (blk.text) { const cp = document.createElement("p"); cp.style.marginBottom = blk.items ? "0.45rem" : "0"; appendRichText(cp, blk.text); box.appendChild(cp); }
              if (blk.items && blk.items.length) {
                const cul = document.createElement("ul");
                blk.items.forEach(function (it) { const li = document.createElement("li"); appendRichText(li, it); cul.appendChild(li); });
                box.appendChild(cul);
              }
              secEl.appendChild(box);
            } else if (blk.type === "table") {
              const wrap = document.createElement("div"); wrap.className = "table-wrap";
              const tbl = document.createElement("table");
              const thead = document.createElement("thead");
              const htr = document.createElement("tr");
              (blk.headers || []).forEach(function (h) { const th = document.createElement("th"); th.textContent = h; htr.appendChild(th); });
              thead.appendChild(htr); tbl.appendChild(thead);
              const tbody = document.createElement("tbody");
              (blk.rows || []).forEach(function (row) {
                const tr = document.createElement("tr");
                row.forEach(function (cell) { const td = document.createElement("td"); appendRichText(td, cell); tr.appendChild(td); });
                tbody.appendChild(tr);
              });
              tbl.appendChild(tbody); wrap.appendChild(tbl); secEl.appendChild(wrap);
            } else if (blk.type === "figure") {
              const fig = document.createElement("figure"); fig.className = "inline-figure";
              const svgNode = parseSafeSvg(blk.svg);
              if (svgNode) {
                const zRow = document.createElement("div"); zRow.className = "figure-zoom-row";
                const hint = document.createElement("span"); hint.className = "figure-zoom-hint"; hint.textContent = "Tap to zoom"; zRow.appendChild(hint);
                fig.appendChild(zRow);
                fig.appendChild(svgNode);
                const cap = document.createElement("figcaption"); cap.className = "figure-caption"; appendRichText(cap, blk.caption || ""); fig.appendChild(cap);
                fig.addEventListener("click", function () { openLightbox(svgNode, cap.textContent.trim()); });
                secEl.appendChild(fig);
              }
            }
          });
          body.appendChild(secEl);
        });

        questionCard.appendChild(body);

        // Bottom Mark Read & Next Unread CTA bar
        const footerCta = document.createElement("div");
        footerCta.className = "q-footer-cta";
        const isReadNow = readSet.has(item.id);
        const hint = document.createElement("div");
        hint.className = "q-footer-hint";
        hint.textContent = isReadNow
          ? "This question is marked Read — its " + ((ans.mcqs || []).length) + " MCQs are unlocked in Revision."
          : "Finished studying? Mark as Read to unlock its " + ((ans.mcqs || []).length) + " Revision MCQs.";
        footerCta.appendChild(hint);

        const nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.className = "btn-primary";
        nextBtn.textContent = isReadNow ? "Go to Next Unread →" : "Mark as Read & Next Unread →";
        nextBtn.addEventListener("click", function () {
          if (!readSet.has(item.id)) {
            readSet.add(item.id);
            saveRead();
            updateGlobalCounters();
          }
          const filtered = getFilteredQuestions();
          const nextU = filtered.find(function (q) { return Boolean(answersMap[q.id]) && !readSet.has(q.id); }) ||
                        getAnsweredQuestions().find(function (q) { return !readSet.has(q.id); });
          if (nextU) {
            selectQuestion(nextU.id, true);
          } else {
            renderQuestion(item);
            renderSidebar();
            updatePager();
          }
        });
        footerCta.appendChild(nextBtn);
        questionCard.appendChild(footerCta);

        // References Footer
        const srcKeys = Object.keys(currentSources);
        if (srcKeys.length) {
          const refs = document.createElement("div"); refs.className = "refs-section";
          const rTitle = document.createElement("div"); rTitle.className = "refs-title"; rTitle.textContent = "Grounded Textbook References (Click to inspect)"; refs.appendChild(rTitle);
          const ul = document.createElement("ul"); ul.className = "refs-list";
          srcKeys.forEach(function (k) {
            const li = document.createElement("li"); li.className = "ref-row"; li.setAttribute("data-cite", k);
            const num = document.createElement("span"); num.className = "ref-num"; num.textContent = "[" + k + "]"; li.appendChild(num);
            const txt = document.createElement("span"); txt.textContent = currentSources[k].book + " — " + currentSources[k].chapter; li.appendChild(txt);
            ul.appendChild(li);
          });
          refs.appendChild(ul);
          questionCard.appendChild(refs);
        }
      }

      function selectQuestion(qid, scrollToTop) {
        const item = allQuestions.find(function (q) { return q.id === qid; });
        if (!item) return;
        activeQuestionId = item.id;
        if (window.location.hash !== "#" + item.id) {
          history.replaceState(null, "", "#" + item.id);
        }
        closeDrawer();
        renderQuestion(item);
        renderSidebar();
        updatePager();
        if (scrollToTop) window.scrollTo({ top: 0, behavior: "smooth" });
      }

      // ==================== REVISION MCQ ENGINE ====================
      function shuffleArray(arr) {
        const copy = arr.slice();
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = copy[i]; copy[i] = copy[j]; copy[j] = tmp;
        }
        return copy;
      }

      function startQuiz(pool, limit) {
        const shuffled = shuffleArray(pool);
        const items = limit && limit < shuffled.length ? shuffled.slice(0, limit) : shuffled;
        quizState = { items: items, idx: 0, score: 0, answered: false, chosen: -1, results: [] };
        renderRevision();
      }

      function renderRevision() {
        viewRevision.replaceChildren();
        const allUnlocked = getUnlockedMcqs("All");

        // Empty State: No Read Questions yet
        if (allUnlocked.length === 0) {
          const card = document.createElement("div");
          card.className = "rev-card rev-empty";
          const icon = document.createElement("div"); icon.className = "rev-empty-icon"; icon.textContent = "✓"; card.appendChild(icon);
          const h2 = document.createElement("h2"); h2.textContent = "Revision MCQs Unlock as You Read"; card.appendChild(h2);
          const p = document.createElement("p");
          p.style.maxWidth = "460px";
          p.style.color = "var(--text-muted)";
          p.textContent = "Mark at least 1 question as Read in the Study tab. Every read question unlocks 3 FAICO-style MCQs grounded in standard ophthalmology textbooks.";
          card.appendChild(p);
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "btn-primary";
          btn.textContent = "Open Next Unread Question →";
          btn.addEventListener("click", function () { switchView("study", { tag: "All", level: "All", answeredOnly: true }); });
          card.appendChild(btn);
          viewRevision.appendChild(card);
          return;
        }

        // Active Quiz Session
        if (quizState) {
          if (quizState.idx >= quizState.items.length) {
            renderQuizSummary();
          } else {
            renderQuizQuestion();
          }
          return;
        }

        // Revision Launcher Dashboard
        const card = document.createElement("div");
        card.className = "rev-card";

        const h2 = document.createElement("h2");
        h2.textContent = "MCQ Revision — From Questions You've Read";
        h2.style.marginBottom = "0.35rem";
        card.appendChild(h2);

        const sub = document.createElement("p");
        sub.style.color = "var(--text-muted)";
        sub.style.fontSize = "0.92rem";
        sub.textContent = "Every MCQ below is drawn exclusively from questions you have already marked as Read, with instant textbook explanations.";
        card.appendChild(sub);

        const readCount = getAnsweredQuestions().filter(function (q) { return readSet.has(q.id); }).length;
        const missedPool = allUnlocked.filter(function (entry) { return missedMcqSet.has(entry.mcq.id); });

        const statGrid = document.createElement("div");
        statGrid.className = "rev-setup-grid";
        [
          { label: "Questions Read", val: String(readCount) },
          { label: "MCQs Unlocked", val: String(allUnlocked.length) },
          { label: "Needs Review", val: String(missedPool.length) }
        ].forEach(function (st) {
          const t = document.createElement("div"); t.className = "rev-stat-tile";
          const l = document.createElement("div"); l.className = "rev-stat-label"; l.textContent = st.label;
          const v = document.createElement("div"); v.className = "rev-stat-num"; v.textContent = st.val;
          t.appendChild(l); t.appendChild(v);
          statGrid.appendChild(t);
        });
        card.appendChild(statGrid);

        // Filter by tag among unlocked MCQs
        const unlockedTags = allTags.filter(function (t) { return getUnlockedMcqs(t).length > 0; });
        const controls = document.createElement("div");
        controls.className = "rev-controls";

        const sel = document.createElement("select");
        sel.className = "tag-select";
        sel.style.maxWidth = "280px";
        sel.setAttribute("aria-label", "Filter revision MCQs by topic tag");

        const optAll = document.createElement("option");
        optAll.value = "All";
        optAll.textContent = "All Read Topics (" + allUnlocked.length + " MCQs)";
        sel.appendChild(optAll);

        unlockedTags.forEach(function (t) {
          const cnt = getUnlockedMcqs(t).length;
          const opt = document.createElement("option");
          opt.value = t;
          opt.textContent = t + " (" + cnt + " MCQs)";
          sel.appendChild(opt);
        });
        if (revTagFilter !== "All" && unlockedTags.indexOf(revTagFilter) === -1) revTagFilter = "All";
        sel.value = revTagFilter;
        sel.addEventListener("change", function () {
          revTagFilter = sel.value;
          renderRevision();
        });
        controls.appendChild(sel);
        card.appendChild(controls);

        const filteredPool = getUnlockedMcqs(revTagFilter);

        const btnRow = document.createElement("div");
        btnRow.style.display = "flex";
        btnRow.style.flexWrap = "wrap";
        btnRow.style.gap = "0.65rem";

        const startAllBtn = document.createElement("button");
        startAllBtn.type = "button";
        startAllBtn.className = "btn-primary";
        startAllBtn.textContent = "Start Quiz (" + filteredPool.length + " MCQs) →";
        startAllBtn.addEventListener("click", function () { startQuiz(filteredPool, filteredPool.length); });
        btnRow.appendChild(startAllBtn);

        if (filteredPool.length > 5) {
          const quick5Btn = document.createElement("button");
          quick5Btn.type = "button";
          quick5Btn.className = "btn-outline";
          quick5Btn.textContent = "Quick 5-MCQ Drill";
          quick5Btn.addEventListener("click", function () { startQuiz(filteredPool, 5); });
          btnRow.appendChild(quick5Btn);
        }

        if (missedPool.length > 0) {
          const retryMissedBtn = document.createElement("button");
          retryMissedBtn.type = "button";
          retryMissedBtn.className = "btn-outline";
          retryMissedBtn.textContent = "Retry Missed (" + missedPool.length + ")";
          retryMissedBtn.addEventListener("click", function () { startQuiz(missedPool, missedPool.length); });
          btnRow.appendChild(retryMissedBtn);
        }

        card.appendChild(btnRow);
        viewRevision.appendChild(card);
      }

      function renderQuizQuestion() {
        const entry = quizState.items[quizState.idx];
        const m = entry.mcq;
        const q = entry.question;
        const ans = entry.answerObj;

        const card = document.createElement("div");
        card.className = "rev-card";

        const top = document.createElement("div");
        top.className = "mcq-top";
        const left = document.createElement("span");
        left.textContent = "MCQ " + (quizState.idx + 1) + " of " + quizState.items.length + " · From Q" + q.globalIndex;
        const right = document.createElement("span");
        right.textContent = "Score: " + quizState.score + " / " + (quizState.answered ? quizState.idx + 1 : quizState.idx);
        top.appendChild(left); top.appendChild(right);
        card.appendChild(top);

        const bar = document.createElement("div"); bar.className = "mcq-bar";
        const fill = document.createElement("div"); fill.className = "mcq-bar-fill";
        fill.style.width = Math.round(((quizState.idx + (quizState.answered ? 1 : 0)) / quizState.items.length) * 100) + "%";
        bar.appendChild(fill);
        card.appendChild(bar);

        const stem = document.createElement("div");
        stem.className = "mcq-stem";
        stem.textContent = m.q;
        card.appendChild(stem);

        const optsWrap = document.createElement("div");
        optsWrap.className = "mcq-options";
        const letters = ["A", "B", "C", "D"];

        m.options.forEach(function (optText, optIdx) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "mcq-option";
          btn.disabled = quizState.answered;

          if (quizState.answered) {
            if (optIdx === m.answer) btn.classList.add("correct");
            else if (optIdx === quizState.chosen) btn.classList.add("wrong");
          }

          const lBadge = document.createElement("span"); lBadge.className = "mcq-letter"; lBadge.textContent = letters[optIdx];
          const txt = document.createElement("span"); txt.textContent = optText;
          btn.appendChild(lBadge); btn.appendChild(txt);

          btn.addEventListener("click", function () {
            if (quizState.answered) return;
            quizState.answered = true;
            quizState.chosen = optIdx;
            const isCorrect = optIdx === m.answer;
            if (isCorrect) {
              quizState.score += 1;
              missedMcqSet.delete(m.id);
            } else {
              missedMcqSet.add(m.id);
            }
            saveMissed();
            quizState.results.push({ entry: entry, correct: isCorrect });
            renderRevision();
          });
          optsWrap.appendChild(btn);
        });
        card.appendChild(optsWrap);

        if (quizState.answered) {
          const isCorrect = quizState.chosen === m.answer;
          const fb = document.createElement("div");
          fb.className = "mcq-feedback " + (isCorrect ? "is-correct" : "is-wrong");

          const fh = document.createElement("div");
          fh.className = "mcq-feedback-head";
          fh.textContent = isCorrect ? "✓ Correct!" : "✗ Incorrect — Correct answer is " + letters[m.answer];
          fb.appendChild(fh);

          const fp = document.createElement("p");
          fp.style.fontSize = "0.92rem";
          fp.textContent = m.explanation + " ";
          if (m.cite && ans.sources && ans.sources[m.cite]) {
            const cBtn = document.createElement("button");
            cBtn.type = "button";
            cBtn.className = "cite-btn";
            cBtn.textContent = m.cite;
            cBtn.addEventListener("click", function () { openCitation(m.cite, ans.sources); });
            fp.appendChild(cBtn);
          }
          fb.appendChild(fp);

          const actions = document.createElement("div");
          actions.className = "mcq-feedback-actions";

          const reviewBtn = document.createElement("button");
          reviewBtn.type = "button";
          reviewBtn.className = "btn-outline";
          reviewBtn.style.fontSize = "0.82rem";
          reviewBtn.style.padding = "0.42rem 0.78rem";
          reviewBtn.textContent = "Review Full Answer (Q" + q.globalIndex + ")";
          reviewBtn.addEventListener("click", function () {
            quizState = null;
            switchView("study", { tag: "All", level: "All", answeredOnly: true, questionId: q.id });
          });
          actions.appendChild(reviewBtn);

          const nextBtn = document.createElement("button");
          nextBtn.type = "button";
          nextBtn.className = "btn-primary";
          nextBtn.textContent = quizState.idx + 1 < quizState.items.length ? "Next MCQ →" : "See Results →";
          nextBtn.addEventListener("click", function () {
            quizState.idx += 1;
            quizState.answered = false;
            quizState.chosen = -1;
            renderRevision();
          });
          actions.appendChild(nextBtn);

          fb.appendChild(actions);
          card.appendChild(fb);
        }

        const exitWrap = document.createElement("div");
        exitWrap.style.marginTop = "0.9rem";
        exitWrap.style.textAlign = "right";
        const exitBtn = document.createElement("button");
        exitBtn.type = "button";
        exitBtn.className = "btn-outline";
        exitBtn.style.fontSize = "0.78rem";
        exitBtn.style.padding = "0.35rem 0.7rem";
        exitBtn.textContent = "End Session";
        exitBtn.addEventListener("click", function () { quizState = null; renderRevision(); });
        exitWrap.appendChild(exitBtn);
        card.appendChild(exitWrap);

        viewRevision.appendChild(card);
      }

      function renderQuizSummary() {
        const total = quizState.items.length;
        const pct = total ? Math.round((quizState.score / total) * 100) : 0;
        const missed = quizState.results.filter(function (r) { return !r.correct; }).map(function (r) { return r.entry; });

        const card = document.createElement("div");
        card.className = "rev-card";
        card.style.textAlign = "center";

        const h2 = document.createElement("h2");
        h2.textContent = "Revision Session Complete";
        card.appendChild(h2);

        const big = document.createElement("div");
        big.style.fontSize = "2.2rem";
        big.style.fontWeight = "700";
        big.style.color = pct >= 70 ? "#166534" : "var(--primary)";
        big.style.margin = "0.65rem 0 0.25rem";
        big.textContent = quizState.score + " / " + total + " (" + pct + "%)";
        card.appendChild(big);

        const note = document.createElement("p");
        note.style.color = "var(--text-muted)";
        note.style.marginBottom = "1.25rem";
        note.textContent = missed.length === 0
          ? "Perfect score! Every concept from this session is locked in."
          : pct >= 70
            ? "Above the 70% FAICO Stage-I MCQ passing benchmark — review the missed items below to reach 100%."
            : "FAICO Stage-I MCQ pass mark is 70% — review the missed questions below to lock them in.";
        card.appendChild(note);

        const btns = document.createElement("div");
        btns.style.display = "flex";
        btns.style.flexWrap = "wrap";
        btns.style.justifyContent = "center";
        btns.style.gap = "0.65rem";

        if (missed.length > 0) {
          const retryBtn = document.createElement("button");
          retryBtn.type = "button";
          retryBtn.className = "btn-primary";
          retryBtn.textContent = "Retry Missed (" + missed.length + ") →";
          retryBtn.addEventListener("click", function () { startQuiz(missed, missed.length); });
          btns.appendChild(retryBtn);
        }

        const newBtn = document.createElement("button");
        newBtn.type = "button";
        newBtn.className = missed.length > 0 ? "btn-outline" : "btn-primary";
        newBtn.textContent = "New Revision Session";
        newBtn.addEventListener("click", function () { quizState = null; renderRevision(); });
        btns.appendChild(newBtn);

        const homeBtn = document.createElement("button");
        homeBtn.type = "button";
        homeBtn.className = "btn-outline";
        homeBtn.textContent = "Back to Home";
        homeBtn.addEventListener("click", function () { quizState = null; switchView("home"); });
        btns.appendChild(homeBtn);

        card.appendChild(btns);
        viewRevision.appendChild(card);

        if (missed.length > 0) {
          const letters = ["A", "B", "C", "D"];
          const reviewCard = document.createElement("div");
          reviewCard.className = "rev-card";

          const rh = document.createElement("h3");
          rh.style.fontSize = "1.02rem";
          rh.style.marginBottom = "0.85rem";
          rh.textContent = "Missed Questions to Review (" + missed.length + ")";
          reviewCard.appendChild(rh);

          const list = document.createElement("div");
          list.style.display = "flex";
          list.style.flexDirection = "column";
          list.style.gap = "0.85rem";

          missed.forEach(function (entry) {
            const m = entry.mcq;
            const q = entry.question;
            const ans = entry.answerObj;

            const itemBox = document.createElement("div");
            itemBox.className = "mcq-feedback is-wrong";
            itemBox.style.marginTop = "0";

            const stemEl = document.createElement("div");
            stemEl.style.fontWeight = "700";
            stemEl.style.fontSize = "0.94rem";
            stemEl.style.color = "var(--text)";
            stemEl.textContent = "Q" + q.globalIndex + " · " + m.q;
            itemBox.appendChild(stemEl);

            const ansLine = document.createElement("div");
            ansLine.style.fontSize = "0.88rem";
            ansLine.style.fontWeight = "700";
            ansLine.style.color = "#166534";
            ansLine.textContent = "Correct Answer (" + letters[m.answer] + "): " + m.options[m.answer];
            itemBox.appendChild(ansLine);

            const expLine = document.createElement("p");
            expLine.style.fontSize = "0.88rem";
            expLine.style.color = "var(--text)";
            expLine.textContent = m.explanation + " ";
            if (m.cite && ans.sources && ans.sources[m.cite]) {
              const cBtn = document.createElement("button");
              cBtn.type = "button";
              cBtn.className = "cite-btn";
              cBtn.textContent = m.cite;
              cBtn.addEventListener("click", function () { openCitation(m.cite, ans.sources); });
              expLine.appendChild(cBtn);
            }
            itemBox.appendChild(expLine);

            const actionRow = document.createElement("div");
            const jumpBtn = document.createElement("button");
            jumpBtn.type = "button";
            jumpBtn.className = "btn-outline";
            jumpBtn.style.fontSize = "0.8rem";
            jumpBtn.style.padding = "0.35rem 0.7rem";
            jumpBtn.textContent = "Review Full Answer (Q" + q.globalIndex + ") →";
            jumpBtn.addEventListener("click", function () {
              quizState = null;
              switchView("study", { tag: "All", level: "All", answeredOnly: true, questionId: q.id });
            });
            actionRow.appendChild(jumpBtn);
            itemBox.appendChild(actionRow);

            list.appendChild(itemBox);
          });

          reviewCard.appendChild(list);
          viewRevision.appendChild(reviewCard);
        }
      }

      // ==================== EVENT LISTENERS ====================
      brandBtn.addEventListener("click", function () { switchView("home"); });
      tabHome.addEventListener("click", function () { switchView("home"); });
      tabStudy.addEventListener("click", function () { switchView("study"); });
      tabRevision.addEventListener("click", function () { quizState = null; switchView("revision"); });

      document.addEventListener("click", function (e) {
        const citeTarget = e.target.closest("[data-cite]");
        if (citeTarget) openCitation(citeTarget.getAttribute("data-cite"));
      });

      clearFilterBtn.addEventListener("click", function () {
        activeTag = "All";
        activeLevel = "All";
        unreadOnly = false;
        searchQuery = "";
        searchInput.value = "";
        unreadOnlyToggle.checked = false;
        tagSelect.value = "All";
        renderLevelFilters();
        renderSidebar();
        updatePager();
      });

      tagSelect.addEventListener("change", function () {
        activeTag = tagSelect.value;
        const filtered = getFilteredQuestions();
        const target = getNextUnreadQuestion(filtered);
        if (target) selectQuestion(target.id, true);
        else { renderSidebar(); updatePager(); }
      });

      searchInput.addEventListener("input", function () {
        searchQuery = searchInput.value;
        renderSidebar();
        updatePager();
      });

      answeredOnlyToggle.addEventListener("change", function () {
        answeredOnly = answeredOnlyToggle.checked;
        renderSidebar();
        updatePager();
      });

      unreadOnlyToggle.addEventListener("change", function () {
        unreadOnly = unreadOnlyToggle.checked;
        renderSidebar();
        updatePager();
      });

      prevQBtn.addEventListener("click", function () {
        const list = getFilteredQuestions();
        const idx = list.findIndex(function (q) { return q.id === activeQuestionId; });
        if (idx > 0) selectQuestion(list[idx - 1].id, true);
      });

      nextQBtn.addEventListener("click", function () {
        const list = getFilteredQuestions();
        const idx = list.findIndex(function (q) { return q.id === activeQuestionId; });
        if (idx >= 0 && idx < list.length - 1) selectQuestion(list[idx + 1].id, true);
        else if (idx === -1 && list.length > 0) selectQuestion(list[0].id, true);
      });

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
          if (lightboxBackdrop.classList.contains("open")) closeLightbox();
          else if (drawerBackdrop.classList.contains("open")) closeDrawer();
          else if (sidebar.classList.contains("open")) closeSidebar();
          return;
        }
        if (currentView !== "study" || document.activeElement === searchInput) return;
        if (lightboxBackdrop.classList.contains("open") || drawerBackdrop.classList.contains("open")) return;
        if (e.key === "ArrowLeft") prevQBtn.click();
        else if (e.key === "ArrowRight") nextQBtn.click();
      });

      // PWA Service Worker & Install Prompt
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js").catch(function () {});
        });
      }

      let deferredPrompt = null;
      const installBtn = document.getElementById("installBtn");
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.classList.add("visible");
      });
      installBtn.addEventListener("click", function () {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        deferredPrompt.userChoice.finally(function () {
          deferredPrompt = null;
          installBtn.classList.remove("visible");
        });
      });

      // Bootstrap
      async function bootstrap() {
        try {
          const [currRes, manifestRes] = await Promise.all([
            fetch("./glaucoma_cognitive_skills.json"),
            fetch("./data/manifest.json")
          ]);
          const curriculum = await currRes.json();
          const manifest = await manifestRes.json();

          allTags = Array.isArray(curriculum.tags) ? curriculum.tags : [];
          let gIdx = 1;
          (curriculum.levels || []).forEach(function (lv) {
            (lv.categories || []).forEach(function (cat) {
              (cat.questions || []).forEach(function (q) {
                allQuestions.push({
                  id: q.id,
                  number: q.number,
                  globalIndex: gIdx++,
                  level: lv.level,
                  category: cat.category,
                  question: q.question,
                  tags: q.tags || [],
                  sub_items: q.sub_items || null
                });
              });
            });
          });

          const batchResults = await Promise.all(
            (manifest.batches || []).map(function (url) {
              return fetch(url).then(function (r) { return r.json(); });
            })
          );

          batchResults.forEach(function (batchObj) {
            Object.keys(batchObj).forEach(function (k) { answersMap[k] = batchObj[k]; });
          });

          updateGlobalCounters();
          renderLevelFilters();
          renderTagDropdown();

          function routeFromHash() {
            const hash = window.location.hash ? window.location.hash.slice(1) : "";
            if (hash === "revision") {
              switchView("revision");
            } else if (hash === "study") {
              switchView("study");
            } else if (hash && allQuestions.some(function (q) { return q.id === hash; })) {
              const found = allQuestions.find(function (q) { return q.id === hash; });
              switchView("study", { questionId: found.id, answeredOnly: Boolean(answersMap[found.id]) });
            } else {
              switchView("home");
            }
          }

          window.addEventListener("hashchange", routeFromHash);
          routeFromHash();
        } catch (_) {
          viewHome.replaceChildren();
          const box = document.createElement("div");
          box.className = "rev-card";
          box.textContent = "Unable to load study data. Please reload the page.";
          viewHome.appendChild(box);
        }
      }

      bootstrap();
    })();
  </script>
</body>
</html>
